<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login — SOS Emergency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

<div class="auth-wrap">
  <!-- Left panel — branding -->
  <div class="auth-brand" aria-hidden="true">
    <div class="ab-inner">
      <div class="logo logo--lg">
        <img class="logo-image" src="media/AlertOrbit.png" alt="AlertOrbit" />
        <span class="logo-text">Alert<strong>Orbit</strong></span>
      </div>
      <h2 class="ab-title">Staff Control<br>Portal</h2>
      <p class="ab-sub">Secure access for emergency response coordinators and dispatchers.</p>
      <div class="ab-stats">
        <div class="abs-item"><span class="abs-num" id="abLive">—</span><span class="abs-label">Live Alerts</span></div>
        <div class="abs-item"><span class="abs-num" id="abTotal">—</span><span class="abs-label">Total Today</span></div>
      </div>
    </div>
  </div>

  <!-- Right panel — form -->
  <div class="auth-form-panel">
    <div class="afp-inner">

      <!-- Tab toggle -->
      <div class="auth-tabs" role="tablist" aria-label="Authentication options">
        <button class="auth-tab auth-tab--active" id="tabLogin" role="tab" aria-selected="true" aria-controls="panelLogin" onclick="switchTab('login')">Sign In</button>
        <button class="auth-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="panelSignup" onclick="switchTab('signup')">Create Account</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
        <h1 class="form-title">Welcome back</h1>
        <p class="form-sub">Sign in to your staff account</p>

        <div id="loginError" class="form-error" hidden role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="loginEmail">Email address</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="loginEmail" name="email" class="field-input" placeholder="staff@agency.gov" autocomplete="email" required />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="loginPassword">Password</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="loginPassword" name="password" class="field-input" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="field-eye" id="loginEye" aria-label="Toggle password visibility" onclick="togglePwd('loginPassword','loginEye')">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="loginSubmit">
            <span class="btn-submit__text">Sign In</span>
            <span class="btn-submit__spinner" hidden aria-hidden="true"></span>
          </button>
        </form>

        <p class="form-hint">Demo: <code>staff@demo.com</code> / <code>demo1234</code></p>
      </div>

      <!-- SIGNUP FORM -->
      <div id="panelSignup" role="tabpanel" aria-labelledby="tabSignup" hidden>
        <h1 class="form-title">Create account</h1>
        <p class="form-sub">Register as an emergency response staff member</p>

        <div id="signupError" class="form-error" hidden role="alert"></div>
        <div id="signupSuccess" class="form-success" hidden role="status"></div>

        <form id="signupForm" novalidate>
          <div class="field-group">
            <label class="field-label" for="signupName">Full name</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="signupName" name="name" class="field-input" placeholder="Jane Smith" autocomplete="name" required />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupRole">Role / Department</label>
            <div class="field-wrap field-wrap--select">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
              <select id="signupRole" name="role" class="field-input field-select" required>
                <option value="">Select department</option>
                <option value="Dispatcher">Dispatcher</option>
                <option value="Coordinator">Emergency Coordinator</option>
                <option value="Police">Police Liaison</option>
                <option value="Medical">Medical Response</option>
                <option value="Fire">Fire Department</option>
                <option value="Admin">Administrator</option>
              </select>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupEmail">Work email</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="signupEmail" name="email" class="field-input" placeholder="jane@agency.gov" autocomplete="email" required />
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="signupPassword">Password</label>
            <div class="field-wrap">
              <svg class="field-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signupPassword" name="password" class="field-input" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
              <button type="button" class="field-eye" aria-label="Toggle password visibility" onclick="togglePwd('signupPassword',this)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="pwd-strength" id="pwdStrength" aria-live="polite">
              <div class="pws-bar"><div class="pws-fill" id="pwsFill"></div></div>
              <span id="pwsLabel"></span>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="signupSubmit">
            <span class="btn-submit__text">Create Account</span>
            <span class="btn-submit__spinner" hidden aria-hidden="true"></span>
          </button>
        </form>
      </div>

      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Emergency Screen
      </a>
    </div>
  </div>
</div>

<script src="js/config.js?v=20260428-roomfix"></script>
<script src="js/db.js?v=20260428-roomfix"></script>
<script src="js/auth.js?v=20260428-roomfix"></script>
</body>
</html>
